<!doctype html>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&family=Space+Grotesk:wght@600&display=swap" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff3e6; font-family: Manrope, sans-serif; color: #0f172a; }
  .page { padding: 16px 12px; }
  .panel { background: rgba(255,255,255,0.72); border: 1px solid rgba(226,232,240,0.9);
           border-radius: 32px; padding: 16px; box-shadow: 0 22px 50px -38px rgba(15,23,42,.45); }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .kicker { font-size: .7rem; font-weight: 800; letter-spacing: .18em; text-transform: uppercase;
            color: #4338ca; display: flex; align-items: center; gap: 8px; }
  .kicker::before { content:""; width: 18px; height: 3px; border-radius: 9999px; background: #4338ca; }
  .h2 { font-family: "Space Grotesk", sans-serif; font-weight: 600; font-style: italic;
        letter-spacing: -.02em; font-size: 1.35rem; line-height: 1.25; margin-top: 4px; }
  .tag { display:inline-flex; align-items:center; gap:6px; font-size:.72rem; font-weight:700;
         padding:5px 11px; border-radius:9999px; background:#fff; border:1px solid rgba(226,232,240,.9); }
  .dot { width:7px; height:7px; border-radius:9999px; background:#10b981; }
  .grid { margin-top: 16px; display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }

  .sd-tile { perspective: 900px; display: block; height: 100%; text-decoration: none; color: inherit; }
  .sd-tile__inner { position: relative; height: 100%; border-radius: 1.75rem;
    background: linear-gradient(160deg,#fff 0%,#f7f9fc 100%);
    border: 1px solid rgba(226,232,240,.9);
    box-shadow: 0 22px 50px -38px rgba(15,23,42,.45);
    display: flex; flex-direction: column; align-items: flex-start; padding: 0.875rem; }
  .sd-tile__inner::before { content:""; position:absolute; inset:0; border-radius:inherit;
    background: var(--tint, transparent); opacity:.9; pointer-events:none; }
  .sd-act { display:flex; height:3.35rem; width:3.35rem; align-items:center; justify-content:center;
    border-radius:1.05rem; color:#fff; flex-shrink:0; }
  .sd-act-arrow { display:flex; height:2.1rem; width:2.1rem; align-items:center; justify-content:center;
    border-radius:9999px; color:#94a3b8; background:rgba(255,255,255,.65); border:1px solid rgba(226,232,240,.9); }
  .arrow-pos { position:absolute; right:0.75rem; top:0.75rem; }
  /* copy wrapper: mt-auto w-full min-w-0 pt-4 */
  .copy { margin-top:auto; width:100%; min-width:0; padding-top:1rem; }
  .sd-card-title { font-size:1.05rem; font-weight:700; letter-spacing:-.01em; line-height:1.375;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  /* .sd-body + .sd-act-desc + mt-1 + line-clamp-3 */
  .sd-act-desc { font-weight:500; color:#475569; font-size:1rem; line-height:1.75; margin-top:.25rem;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }

  /* ---- the .sd-qa phone block under test ---- */
  @media (max-width: 639px) {
    .sd-qa .sd-tile__inner { min-height:7rem; border-radius:1.375rem;
      box-shadow:0 14px 30px -24px rgba(15,23,42,.4); }
    .sd-qa .sd-act { height:2.55rem; width:2.55rem; border-radius:.85rem; }
    .sd-qa .sd-act svg { height:1.25rem; width:1.25rem; }
    .sd-qa .sd-act-arrow { height:1.15rem; width:1.15rem; background:none; border:0; box-shadow:none; color:#94a3b8; }
    .sd-qa .sd-act-arrow svg { height:.95rem; width:.95rem; }
    .sd-qa .sd-card-title { font-size:.875rem; letter-spacing:-.02em; }
    .sd-qa .sd-act-desc { font-size:.72rem; line-height:1.45; min-height:3.14rem; }
  }
</style>
<div class="page">
  <section class="panel">
    <div class="head">
      <div><p class="kicker">Quick Actions</p><h2 class="h2">Everything at a glance</h2></div>
      <span class="tag"><span class="dot"></span>Ready</span>
    </div>
    <div class="grid" id="grid"></div>
  </section>
</div>
<script>
const arrow = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg>';
const glyph = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M12 6v12"/></svg>';
const actions = [
  {title:"Make An Outing", description:"Request a café, meal, or market outing.", badge:"linear-gradient(145deg,#0f172a 0%,#4338ca 52%,#06b6d4 100%)", tint:"linear-gradient(160deg,rgba(67,56,202,.13) 0%,rgba(6,182,212,.09) 100%)", glow:"rgba(67,56,202,.5)"},
  {title:"My Outings", description:"Track approvals, returns, and gate status.", badge:"linear-gradient(145deg,#1e40af 0%,#38bdf8 100%)", tint:"linear-gradient(160deg,rgba(30,64,175,.12) 0%,rgba(56,189,248,.10) 100%)", glow:"rgba(37,99,235,.5)"},
  {title:"SOS Alert", description:"Share your live location with security instantly.", badge:"linear-gradient(145deg,#fb7185 0%,#f43f5e 48%,#e11d48 100%)", tint:"linear-gradient(160deg,rgba(244,63,94,.13) 0%,rgba(225,29,72,.08) 100%)", glow:"rgba(225,29,72,.5)"},
  {title:"Leave Application", description:"Request multi-day leave for festivals or home visits.", badge:"linear-gradient(145deg,#6d28d9 0%,#a855f7 55%,#d946ef 100%)", tint:"linear-gradient(160deg,rgba(168,85,247,.13) 0%,rgba(217,70,239,.09) 100%)", glow:"rgba(147,51,234,.5)"},
  {title:"Report Delay", description:"Tell your hostel you’re returning late.", badge:"linear-gradient(145deg,#0f766e 0%,#14b8a6 55%,#2dd4bf 100%)", tint:"linear-gradient(160deg,rgba(20,184,166,.13) 0%,rgba(45,212,191,.09) 100%)", glow:"rgba(13,148,136,.5)"},
];
document.getElementById('grid').innerHTML = actions.map(a => `
  <a class="sd-tile sd-qa" style="--tint:${a.tint}">
    <div class="sd-tile__inner">
      <span class="sd-act-arrow arrow-pos">${arrow}</span>
      <span class="sd-act" style="background:${a.badge};box-shadow:0 14px 26px -12px ${a.glow}">${glyph}</span>
      <div class="copy">
        <span class="sd-card-title">${a.title}</span>
        <span class="sd-act-desc">${a.description}</span>
      </div>
    </div>
  </a>`).join('');
</script>
