# NITP-SafeExit — app containers on a private network.
# nginx + certbot live on the HOST and reverse-proxy into these published ports.
#
# The backend runs on PostgreSQL. DATABASE_URL in backend/.env is the only thing that says
# which server, and the service below is the local development target for it.
#
# MongoDB is still reachable from two scripts — scripts/etl.js and scripts/mongoInventory.js
# read Atlas so the data can be moved and re-moved until cutover — but nothing the app
# serves touches it.
#
# At cutover, the college's own PostgreSQL replaces this container: drop the service,
# point DATABASE_URL at their host, and the rest of the file is unchanged. Keeping the
# service here means development never depends on reaching the campus network.

services:
  # Development database only. NOT a production deployment — the college runs their own
  # PostgreSQL on the ARP network and that is what DATABASE_URL points at in production.
  # Pinned to 16-alpine; the schema is deliberately written for 9.5+ with zero extensions,
  # so it applies unchanged if the college turns out to run 12 or 14.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-safeexit}
      POSTGRES_USER: ${POSTGRES_USER:-safeexit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-safeexit_dev}
      # Deterministic collation, so ORDER BY on names matches the college server.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    # Loopback only. Nothing outside this machine reaches the dev database.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Without this, backend starts before Postgres finishes initdb and exits on connect.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-safeexit} -d ${POSTGRES_DB:-safeexit}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - safeexit

  backend:
    build:
      context: ./backend
    image: safeexit-backend:latest
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 5000
    # Only exposed to the host loopback; nginx reaches it, the public internet does not.
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - safeexit

  frontend:
    build:
      context: ./safeexit
      args:
        # Empty on purpose: getApiBase() uses the /api/backend rewrite for non-localhost.
        NEXT_PUBLIC_API_URL: ""
        # Baked into the build because Next resolves rewrites() at build time.
        BACKEND_ORIGIN: "http://backend:5000"
    image: safeexit-frontend:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # The Next rewrite proxies /api/backend/* to the backend container by service name.
      BACKEND_ORIGIN: "http://backend:5000"
      # commissioning routes (/scanner-check, /gate-cards) 404 unless this is "1".
      # Read at runtime by src/proxy.js. Set to "1" only while commissioning a gate.
      SCANNER_TOOLS: ${SCANNER_TOOLS:-0}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    networks:
      - safeexit

networks:
  safeexit:
    driver: bridge

volumes:
  pgdata:
