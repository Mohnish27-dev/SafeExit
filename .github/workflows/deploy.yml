name: Build and Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/safeexit-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./safeexit
          file: ./safeexit/Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=
            BACKEND_ORIGIN=http://backend:5000
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/safeexit-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH to EC2 and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "Navigating to app directory..."
            cd ${{ secrets.EC2_PROJECT_PATH }}
            
            echo "Pulling latest git changes..."
            git pull origin main
            
            echo "Pulling latest Docker images from Docker Hub..."
            docker pull ${{ secrets.DOCKER_USERNAME }}/safeexit-backend:latest
            docker pull ${{ secrets.DOCKER_USERNAME }}/safeexit-frontend:latest
            
            echo "Restarting services with production compose..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            
            echo "Cleaning unused images..."
            docker image prune -f
            
            echo "Deployment completed successfully!"
