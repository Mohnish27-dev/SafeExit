name: Build and Push Images

# EC2 IS RETIRED. This workflow used to SSH into it and redeploy on every push to main,
# which made a merge to main a deployment — and, once the backend moved to PostgreSQL,
# a deployment onto a box with no PostgreSQL and no DATABASE_URL, where it would have
# crash-looped rather than started.
#
# So the SSH job is gone and this workflow now only builds the two images and pushes them
# to Docker Hub. Merging to main is a code change again, not a release.
#
# THE COLLEGE SERVER PULLS. Deployment there is a deliberate act on the machine itself:
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# That is also the only thing that works: the campus server sits on the college LAN, which
# GitHub Actions cannot reach. See docs/DEPLOY-COLLEGE.md.
#
# workflow_dispatch is kept so images can be rebuilt from a branch without a merge.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/safeexit-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./safeexit
          file: ./safeexit/Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=
            BACKEND_ORIGIN=http://backend:5000
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/safeexit-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
