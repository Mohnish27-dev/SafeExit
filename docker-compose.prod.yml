# Production Compose file — Uses pre-built images from Docker Hub.
# This prevents EC2 from freezing during high-memory Next.js builds.

services:
    backend:
        restart: unless-stopped
        build:
            context: ./backend
            dockerfile: Dockerfile
        env_file:
            - ./backend/.env
        environment:
            NODE_ENV: production
            PORT: 5000
        ports:
            - "5000:5000"

    frontend:
        restart: unless-stopped
        build:
            context: ./safeexit
            dockerfile: Dockerfile
        environment:
            NODE_ENV: production
            BACKEND_ORIGIN: "http://backend:5000"
            SCANNER_TOOLS: ${SCANNER_TOOLS:-0}
        ports:
            - "4001:4001"
        depends_on:
            - backend
